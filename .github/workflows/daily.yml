name: Daily digest

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC, after arXiv's overnight announcement
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; leave unset for the free keyword scorer
        run: python scripts/fetch.py

      - name: Commit new stories
        run: |
          git config user.name "edgewise-bot"
          git config user.email "edgewise-bot@users.noreply.github.com"
          git add docs/data/stories.json
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
